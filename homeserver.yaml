server_name: "nimbo-synapse.onrender.com"
public_baseurl: "https://nimbo-synapse.onrender.com/"
pid_file: /data/homeserver.pid

listeners:
  - port: 8008
    tls: false
    type: http
    x_forwarded: true
    resources:
      - names: [client, federation]
        compress: false

database:
  name: sqlite3
  args:
    database: /data/homeserver.db

log_config: "/data/log.config"
media_store_path: /data/media_store

# ── Registration ─────────────────────────────
enable_registration: true
enable_registration_without_verification: true
registrations_require_3pid: false
allow_guest_access: true
registration_shared_secret: "nimbo_super_secret_key_change_this_123"

# ── Security ─────────────────────────────
macaroon_secret_key: "nimbo_macaroon_secret_change_this_456"
form_secret: "nimbo_form_secret_change_this_789"
trusted_key_servers:
  - server_name: "matrix.org"
suppress_key_server_warning: true

# ── Performance ─────────────────────────────
event_cache_size: 10K
report_stats: false

# ── Directory ─────────────────────────────
allow_public_rooms_without_auth: true
allow_public_rooms_over_federation: true

# ── User directory (FIX: makes all users searchable) ──────
user_directory:
  enabled: true
  search_all_users: true        # ← users visible even before joining a shared room
  prefer_local_users: true      # ← your server's users ranked first in results

# ── Room directory (FIX: makes public rooms browsable) ────
room_list_publication_rules:
  - action: allow               # ← allows all rooms to be listed publicly

# ── Retention (optional but good for SQLite) ──────────────
forgotten_room_retention_period: 28d
